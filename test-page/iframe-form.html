<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Iframe form</title>
  <style>
    body { font-family: sans-serif; padding: 12px; }
    label { display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h4>Inside iframe</h4>
  <form>
    <label for="if_email">Email (in iframe)</label>
    <input id="if_email" name="email" type="email" /><br />
    <label for="if_notes">Notes</label>
    <textarea id="if_notes" name="notes"></textarea>
  </form>
</body>
</html>
