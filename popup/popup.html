<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Smart Form Filler</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="20" height="20" />
        <span>Smart Form Filler</span>
        <button class="icon-btn" id="openSettings" title="Custom Fields, Options &amp; Backup" style="margin-left:auto;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <circle cx="9" cy="6" r="2.2" fill="currentColor" stroke="none"></circle>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"></circle>
            <line x1="4" y1="18" x2="20" y2="18"></line>
            <circle cx="9" cy="18" r="2.2" fill="currentColor" stroke="none"></circle>
          </svg>
        </button>
      </div>
    </header>
    <main id="view"></main>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
